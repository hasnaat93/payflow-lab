# PayFlow Lab: full local stack.   docker compose up --build
#   UI       http://localhost:5173
#   API      http://localhost:8080/api/v1
#   Swagger  http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - payflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payflow}
      DATABASE_USERNAME: ${POSTGRES_USER:-payflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DEMO_SEED_ON_STARTUP: ${DEMO_SEED_ON_STARTUP:-true}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      SETTLEMENT_SCHEDULE_ENABLED: ${SETTLEMENT_SCHEDULE_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  payflow-db:
