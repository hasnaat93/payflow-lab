spring:
  application:
    name: payflow-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DATABASE_USERNAME:payflow}
    password: ${DATABASE_PASSWORD:payflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Strict input: a request carrying a field the API does not define (for example a
      # card number) is rejected, and 10.50 is never silently truncated to 10 minor units.
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

payflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    seed-on-startup: ${DEMO_SEED_ON_STARTUP:true}
    reset-enabled: ${DEMO_RESET_ENABLED:true}
  simulator:
    max-amount-minor: 5000000
  settlement:
    schedule:
      enabled: ${SETTLEMENT_SCHEDULE_ENABLED:false}
      cron: ${SETTLEMENT_SCHEDULE_CRON:0 30 0 * * *}
